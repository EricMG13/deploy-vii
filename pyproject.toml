[project]
name = "deploy-vii"
version = "0.1.0"
description = "Evidence-grounded credit research and offline Direction C Workbench"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
]

[tool.uv]
package = true
required-version = "==0.12.5"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project.scripts]
deploy-vii = "deploy_vii.__main__:main"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["design/reference", "artifacts", "private", "source-packs", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["^artifacts/", "^private/", "^design/reference/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "live: explicit provider/network test; excluded from ordinary CI",
  "private: requires private input packs; excluded from ordinary CI",
  "browser: actual browser rendering acceptance",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# Guard the tested implementation, while allowing CLI/platform-only branches.
fail_under = 90
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "playwright>=1.64.0",
    "pre-commit-hooks>=6.0.0",
    "prek>=0.5.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
