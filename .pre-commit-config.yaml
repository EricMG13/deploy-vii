default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^design/reference/
      - id: file-endings
        name: Final newlines
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
        exclude: ^design/reference/
      - id: merge-conflicts
        name: Merge conflict markers
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: json
        name: JSON syntax
        entry: uv run --locked check-json
        language: system
        types: [file]
        files: '\.json(?:\.reference)?$'
      - id: toml
        name: TOML syntax
        entry: uv run --locked check-toml
        language: system
        types: [file]
        files: '\.toml(?:\.reference)?$'
      - id: yaml
        name: YAML syntax
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: private-keys
        name: Private key material
        entry: uv run --locked detect-private-key
        language: system
        types: [text]
      - id: large-files
        name: Unexpected large files
        entry: uv run --locked check-added-large-files --maxkb=1024
        language: system
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
