name: Development checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share one group per PR number and cancel superseded runs. Every
# other event (push to main, manual) gets its own group by run_id, so a main run is
# never cancelled by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - run: make check
      - run: make dev-check
  product:
    name: Product checks
    runs-on: ubuntu-24.04
    # 75: M6 took 36m49s on the hosted 4-vCPU runner and M7 adds tests (24 Oct 2026)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # Fail-closed: anything but a clean PR diff of docs-only paths runs the full suite.
          # Two-dot against the fetched base tip: the shallow PR merge checkout has no
          # merge base for a three-dot diff, and extra paths can only choose the full suite.
          code=true
          if [ "$EVENT" = pull_request ] && git fetch --depth=1 origin "$BASE" \
            && paths=$(git diff --name-only "origin/$BASE" HEAD); then
            code=$(printf '%s\n' "$paths" | bash .github/scripts/code_changed.sh) || code=true
          fi
          [ "$code" = false ] || code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - if: steps.changes.outputs.code == 'true'
        run: uv sync --locked
      - if: steps.changes.outputs.code == 'true'
        run: uv run --locked playwright install --with-deps chromium
      - if: steps.changes.outputs.code == 'true'
        run: make product-check
      - name: Report
        if: always()
        env:
          CODE: ${{ steps.changes.outputs.code }}
        run: |
          if [ "$CODE" = true ]; then echo "full suite ran (make product-check above)"
          else echo "docs-only diff: Product checks test run skipped (hygiene, secrets and audit still ran)"; fi
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make secrets
