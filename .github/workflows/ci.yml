name: Development checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share one group per PR number and cancel superseded runs. Every
# other event (push to main, manual) gets its own group by run_id, so a main run is
# never cancelled by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - run: make check
      - run: make dev-check
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # Fail-closed: anything but a clean PR diff of docs-only paths runs the full suite.
          # Two-dot against the fetched base tip: the shallow PR merge checkout has no
          # merge base for a three-dot diff, and extra paths can only choose the full suite.
          code=true
          if [ "$EVENT" = pull_request ] && git fetch --depth=1 origin "$BASE" \
            && paths=$(git diff --name-only "origin/$BASE" HEAD); then
            code=$(printf '%s\n' "$paths" | bash .github/scripts/code_changed.sh) || code=true
          fi
          [ "$code" = false ] || code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
  product-static:
    name: Product static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - run: make product-static
  product-shard:
    name: Product tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # 75: M6 took 36m49s on the hosted 4-vCPU runner and M7 adds tests (24 Oct 2026); each
    # shard runs a subset of tests/product (.github/shards/product.txt)
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [shard-a, shard-b, shard-c]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: make coverage-shard SHARD=${{ matrix.shard }}
        env:
          COVERAGE_FILE: cov-${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-${{ matrix.shard }}
          path: cov-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3
  product-coverage:
    name: Product coverage (combined)
    needs: [changes, product-shard]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-*
          merge-multiple: true
      - name: Combine shard data and enforce the coverage floor
        run: |
          uv run --locked coverage combine cov-shard-*
          uv run --locked coverage report
  product:
    name: Product checks
    needs: [changes, product-static, product-shard, product-coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.changes.result }} ${{ needs.product-static.result }} ${{ needs.product-shard.result }} ${{ needs.product-coverage.result }}
        run: |
          # One status for branch rules. Docs-only: every test job must be skipped.
          # Otherwise (including an unknown detection): every job must have succeeded.
          set -- $RESULTS
          [ "$1" = success ] || { echo "detection failed: $RESULTS"; exit 1; }
          shift
          if [ "$CODE" = false ]; then
            for r in "$@"; do [ "$r" = skipped ] || { echo "unexpected result: $RESULTS"; exit 1; }; done
            echo "docs-only diff: Product checks test run skipped (hygiene and secrets still ran)"
          else
            for r in "$@"; do [ "$r" = success ] || { echo "Product checks failed: $RESULTS"; exit 1; }; done
            echo "full suite ran (static checks, 3 test shards, combined coverage floor)"
          fi
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make secrets
