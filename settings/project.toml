schema_version = 1
phase = "development-tooling-and-product-implementation"
product_runtime_implemented = false
execution_journal_implemented = true
product_shell_implemented = true
live_model_runner_implemented = true

[development]
instruction_file = "CLAUDE.md"
coordinator = "claude-code"
context_index = "docs/development/CONTEXT.md"
task_root = "docs/development/tasks"
publication_owner = "pr-session"
publication_decision = "docs/decisions/0006-delegated-choices-and-orchestration.md"
merge_policy = "squash-after-local-gates-and-recorded-reviews"
worker_publication = "local-commits-only"
confidence_review = "after-code-changes"
rewrite_tournament = "retired-decision-0012"
key_area_tests = "differential-or-property"
size_gate = "advisory-full-diff-no-hard-cap"
python = "3.13.15"
uv = "0.12.5"
type_checker = "mypy-strict"
claude_workers = ".claude/agents"

[development.context]
scope = "coding-sessions-only"
strategy = "native-compaction-plus-source-linked-task-state"
compaction_window_tokens = 500000
occupancy_display = "context-meter-mod-display-only"
automatic_resets = false
lifecycle_controller_implemented = false
observational_workflow_implemented = true
workflow_command = "uv run python -m devtools.workflow"
handoff_template = "docs/development/handoff-template.md"
evaluation_plan = "docs/development/context-management.md"
experimental_checkpoint_percent = 60
checkpoint_action = "assess-at-safe-boundary-only-no-automatic-reset"
comparison_routing = "fixed-model-provider-effort-per-paired-batch"
budget_accounting = "total-goal-across-all-continuations-and-reviews"
observations = "explicit-file-imports-and-sanitized-task-boundary-records"
evidence_root = "artifacts/context-policy"

[model_tests]
provider = "openrouter"
credential_file = "~/Documents/op router.rtf"
credential_token_index = 2
# Reservation prompt bound: ceil(request bytes / this) + 64 (decision 0008, MC-10). Probe-2
# measured 5.61 bytes per token (GLM 5.3 Flash: 867,481 request bytes, 154,609 prompt tokens);
# 3.0 keeps a 1.9x margin over that measurement.
prompt_bytes_per_token_lower_bound = 3.0
credential_handling = "read-at-dispatch-in-memory-never-logged"
selection = "user-named-pool-uniform-random-only-when-more-than-one-model"
record_selection_seed = true
# Decision 0005 amendment (user decision, 24 Oct 2026, superseding the 22 Oct "high"): live
# testing resumes on GPT-6.1 Sol at medium, for every step.
default_effort = "medium"
complex_effort = "medium"
unsupported_xhigh = "use-supported-high-and-record-mapping"
unavailable_route = "record-ineligible-before-draw"
retries = "same-model-new-attempt"
cross_model_comparison = "same-frozen-case-randomized-order"
artifact_root = "artifacts/model-tests"
retain_failures = true
retain_requests_outputs_metrics_events = true
missing_metrics = "null-with-reason"
provider_fallback = "observable-and-separately-classified"
version_policy = "resolve-and-pin-per-comparison-batch"
regime = "docs/decisions/0005-methodology-changes-and-regular-testing.md"
internal_tiers = ["I1-every-change", "I2-replay-on-contract-change", "I3-each-milestone"]
external_tiers = ["E1-module-completion", "E2-milestone-matched-comparison", "E3-weekly-canary"]
recurring_caps_usd = { e1_per_case = 3, e2_per_milestone = 15, e3_per_week = 3 }
cumulative_ceiling_usd = 200
no_credit_fallback = "native-luna-else-labelled-claude-agent-proxy-cohort"
# Task 8.0d (user decision, 24 Oct 2026): E1 runs the CP-1 stages as tool loops, the hybrid
# harness's design ported into the live runner (`live.loop`; decision 0005 row of 24 Oct 2026).
tool_loop = true

# Task 8.0d: each tool-loop step's effort, and the highest level its one escalation (after two
# rejected submits or a completeness-floor rejection) may reach. User-owned; `--effort` given on
# the command line applies to every step instead.
[model_tests.step_effort]
source_context = { effort = "medium", ceiling = "high" }
financials = { effort = "medium", ceiling = "high" }
narrative = { effort = "medium", ceiling = "high" }
readiness = { effort = "medium", ceiling = "high" }

# Task 8.0d: the `financials` completeness floor (statement lines per expected statement and
# source scope) stays off: user decision, 24 Oct 2026, revisited after the cheaper-model choice
# and the CP-1 handoff comparison. Measured on the recorded Sol medium
# transcript hybrid-cp1-6 (accepted there): any floor of 1 or more rejects it, which holds IS and
# CFS lines for FY2025 only and BS lines for 2025-12-31 only. To turn it on:
# [model_tests.completeness_floor]
# min_statement_lines = 1

# The catalog-rule pool (used when `--models` is absent) is the user-named set of decision 0005
# (amendment, 22 Oct 2026): currently GPT-6.1 Sol alone, so the draw is trivial. The earlier
# Luna / GLM 5.3 Flash / latest-DeepSeek pool is superseded; its stored outputs are retained.
[[model_tests.candidates]]
key = "sol"
model_id = "openai/gpt-6.1-sol"
resolution = "explicit-version"
catalog_checked = "2026-10-21"

[frontend]
direction = "C-Workbench"
reference = "design/reference/rbot-design-system.dc.html"
reference_decision = "docs/decisions/0004-design-system-frontend.md"
design_project = "claude-design:1611c8f7-873d-4ee5-82f3-013d0a4d3041"
superseded_reference = "design/reference/direction-c-workbench.dc.html"
incremental_module_rendering = true
accepted_artifacts_only = true
candidate_preview_labelled = true
viewports = ["1440x900", "1280x800"]

[ci]
required_contexts = ["Repository hygiene", "Product checks", "Secrets"]
model_calls = false
private_packs = false
provider_credentials = false
dependency_audit = "separate-manual-or-weekly"
product_gates = "lint-strict-types-unit-integration-browser-coverage"

[runtime_design]
delivery_target = "github-copilot-cli"
arithmetic_owner = "python"
execution = "dependency-aware-sequential-first"
framework = "none-selected"
methodology = "preserve-meaning-adapt-boundaries"
